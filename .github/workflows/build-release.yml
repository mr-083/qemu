name: Build QEMU with NVMe namespace hotplug

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-softmmu
            accel: hvf
            artifact: qemu-system-aarch64-darwin-arm64
            binary: qemu-system-aarch64
          - os: ubuntu-24.04
            target: x86_64-softmmu
            accel: kvm
            artifact: qemu-system-x86_64-linux-amd64
            binary: qemu-system-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-softmmu
            accel: kvm
            artifact: qemu-system-aarch64-linux-arm64
            binary: qemu-system-aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja pkg-config glib pixman

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build \
            pkg-config libglib2.0-dev libpixman-1-dev python3-venv

      - name: Configure
        run: |
          mkdir build && cd build
          ../configure \
            --target-list=${{ matrix.target }} \
            --enable-${{ matrix.accel }} \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            --disable-vnc \
            --disable-spice \
            --disable-usb-redir \
            --disable-guest-agent

      - name: Build
        run: |
          cd build
          ninja ${{ matrix.binary }}

      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: |
          xattr -cr build/${{ matrix.binary }}
          codesign -f -s - \
            --entitlements accel/hvf/entitlements.plist \
            build/${{ matrix.binary }}

      - name: Package
        run: |
          mkdir -p dist
          cp build/${{ matrix.binary }} dist/${{ matrix.artifact }}
          chmod +x dist/${{ matrix.artifact }}
          # Bundle EDK2 firmware for the target architecture
          if echo "${{ matrix.target }}" | grep -q aarch64; then
            bunzip2 -k pc-bios/edk2-aarch64-code.fd.bz2 -c > dist/edk2-aarch64-code.fd
          else
            bunzip2 -k pc-bios/edk2-x86_64-code.fd.bz2 -c > dist/edk2-x86_64-code.fd
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          cd artifacts
          # Move binaries (unique names per platform)
          find . -type f -name "qemu-*" -exec mv {} . \;
          # Deduplicate firmware files (same content from multiple builds)
          find . -type f -name "edk2-*" | sort -u | while read f; do
            base=$(basename "$f")
            [ -f "$base" ] || mv "$f" .
          done
          # Clean empty subdirs
          find . -mindepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
          ls -la
          sha256sum * > SHA256SUMS || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            QEMU with NVMe namespace hotplug and drive_insert command.

            ## Binaries
            | File | Platform |
            |------|----------|
            | qemu-system-aarch64-darwin-arm64 | macOS Apple Silicon (M1-M5) |
            | qemu-system-x86_64-darwin-amd64 | macOS Intel |
            | qemu-system-aarch64-linux-arm64 | Linux ARM64 |
            | qemu-system-x86_64-linux-amd64 | Linux x86_64 |

            ## macOS: apply HVF entitlements after download
            ```
            chmod +x qemu-system-*
            codesign -f -s - --entitlements /path/to/accel/hvf/entitlements.plist qemu-system-*
            ```